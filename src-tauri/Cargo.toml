[package]
name = "packetboat"
version = "1.1.3"
description = "A modern, cross-platform file transfer client (FTP-first, cloud-capable)."
authors = ["Packetboat contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the binary on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "packetboat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: system tray + close-to-tray. image-png: decode the tray PNG icon.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Native folder picker for the "Default local directory" Browse button.
tauri-plugin-dialog = "2"
# Persist window size/position/maximized across launches.
tauri-plugin-window-state = "2"
# Desktop notifications (transfer-complete / failure alerts).
tauri-plugin-notification = "2"
# In-app auto-update (checks a GitHub-hosted manifest; installs signed updates).
tauri-plugin-updater = "2"
# Single instance: a second launch focuses the running window instead of opening
# another copy.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decodes the base64 metadata header for external drag-drop uploads (the file
# bytes ride in the raw IPC body; small metadata rides in a header).
base64 = "0.22"

# Async runtime. Tauri already pulls tokio; we use it directly for fs + net.
tokio = { version = "1", features = ["full"] }
# Bridges OpenDAL's futures-io reader/writer to tokio's AsyncRead/AsyncWrite so
# cloud transfers stream (with live progress) instead of buffering.
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
thiserror = "2"
dirs = "6"

# SFTP transport. russh is a pure-Rust SSH implementation (no system ssh /
# libssh2 dependency, which matters on Windows); russh-sftp layers the SFTP
# subsystem on top of a russh channel.
russh = "0.61"
russh-sftp = "2"

# FTP / FTPS transport. Tokio-native async client. FTPS uses rustls with the
# aws-lc-rs provider (already in the tree via russh, and builds on Windows via
# the prebuilt-NASM config); suppaftp's native-tls module uses Unix-only
# std::os::fd and doesn't build on Windows.
# "deprecated" enables connect_secure_implicit (implicit FTPS).
suppaftp = { version = "10", features = ["tokio", "tokio-rustls-aws-lc-rs", "deprecated"] }
# Mozilla root certificates for FTPS server verification.
webpki-roots = "1"
# FTPS certificate trust-on-first-use: SHA-256 fingerprinting + parsing the
# server cert (subject/issuer/SANs/validity) for the trust prompt.
# Kept at 0.10 (not 0.11): the tree already pulls sha2 0.10 transitively (rsa /
# pkcs5 via OpenDAL), so 0.11 would just add a duplicate for the same SHA-256.
sha2 = "0.10"
x509-parser = "0.18"

# OpenDAL — multi-backend layer for cloud storage (S3, B2, WebDAV, …), exposed
# behind the same StorageBackend trait. Services are reached generically via
# Operator::via_iter(scheme, config), so adding one is config, not code.
opendal = { version = "0.57", features = ["services-s3", "services-webdav", "services-b2"] }

# OS keychain for saved-site passwords (Windows Credential Manager / macOS
# Keychain / Linux Secret Service — the native stores are on by default).
keyring = "4"

# Windows-only: branded toast notifications. The notification plugin only sets
# our app id for the installed build, so unpackaged/dev toasts show as
# "PowerShell" with no icon. We register our own AppUserModelID (display name +
# icon) and send toasts under it so they attribute to Packetboat everywhere.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }
