name: Release

# Build and publish installers for all three desktop platforms whenever a
# version tag (e.g. v0.1.0) is pushed. tauri-action bundles each platform's
# native installers and uploads them to a GitHub release for that tag.
#
# Versions to bump before tagging: package.json, src-tauri/tauri.conf.json,
# and src-tauri/Cargo.toml — then `git tag v0.1.0 && git push origin v0.1.0`.

on:
  push:
    tags:
      - "v*"
  # Allow a manual dry run (builds the bundles without creating a release).
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write # tauri-action needs this to create the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (arm64)
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel (x86_64)
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04 # Linux x86_64 (.deb / .rpm / .AppImage)
            args: ""
          - platform: windows-latest # Windows x86_64 (.msi / .exe NSIS)
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds both arches, so install both targets there.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Install the Tauri CLI
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Windows aws-lc-sys NASM workaround also lives in
          # src-tauri/.cargo/config.toml; set here too for belt-and-braces.
          AWS_LC_SYS_PREBUILT_NASM: "1"
        with:
          # Only attach to a release on a tag push; manual runs just build.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Packetboat {0}', github.ref_name) || '' }}
          releaseBody: "Download the installer for your platform from the assets below."
          # Draft release so you can review the assets and notes before publishing.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
