name: Release

# Build and publish installers for all three desktop platforms whenever a
# version tag (e.g. v0.1.0) is pushed. tauri-action bundles each platform's
# native installers and uploads them to a GitHub release for that tag.
#
# Bump the version before tagging with `npm run bump -- <version>` (keeps
# package.json, tauri.conf.json, Cargo.toml, and Cargo.lock in sync), then
# `git tag v0.1.0 && git push origin v0.1.0`. The `verify` job below fails the
# release if those files drift or the tag doesn't match them.

on:
  push:
    tags:
      - "v*"
  # Allow a manual dry run (builds the bundles without creating a release).
  workflow_dispatch:

jobs:
  # Gate the release — before any expensive platform builds — on: version files
  # in sync, the tag matching the version (on a tag push), and the full test
  # suite (frontend + backend). `publish` needs this job, so a failure here stops
  # every platform build and no release is created. Cheap checks run first so a
  # version/JS problem fails before the Rust toolchain is even installed.
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Verify version files are in sync
        run: node scripts/version.mjs
      - name: Verify the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          FILE_VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          if [ "v$FILE_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match repo version v$FILE_VERSION — bump with 'npm run bump' before tagging."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches repo version v$FILE_VERSION."
      - name: Frontend tests
        run: npm test
      # cargo test compiles the crate, which links Tauri — needs the Linux
      # system libs and the Rust toolchain, same as the Linux build below.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: verify-tests
      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  publish:
    needs: verify
    permissions:
      contents: write # tauri-action needs this to create the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (arm64)
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel (x86_64)
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04 # Linux x86_64 (.deb / .rpm / .AppImage)
            args: ""
          - platform: windows-latest # Windows x86_64 (.msi / .exe NSIS)
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds both arches, so install both targets there.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Install the Tauri CLI
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Windows aws-lc-sys NASM workaround also lives in
          # src-tauri/.cargo/config.toml; set here too for belt-and-braces.
          AWS_LC_SYS_PREBUILT_NASM: "1"
          # Updater signing. Generate a keypair once with `tauri signer generate`,
          # put the public key in tauri.conf.json (plugins.updater.pubkey), and
          # add these two as repository secrets. With bundle.createUpdaterArtifacts
          # on, tauri-action signs the bundles and publishes `latest.json`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Only attach to a release on a tag push; manual runs just build.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Packetboat {0}', github.ref_name) || '' }}
          releaseBody: |
            ## Which download do I need?

            | Your system | File |
            | --- | --- |
            | **Windows** | `…_x64-setup.exe` (installer) — or `…_x64_en-US.msi` |
            | **macOS — Apple Silicon** (M-series) | `…_aarch64.dmg` |
            | **macOS — Intel** | `…_x64.dmg` |
            | **Linux — Debian / Ubuntu** | `…_amd64.deb` |
            | **Linux — Fedora / RHEL** | `…_x86_64.rpm` |
            | **Linux — other / portable** | `…_amd64.AppImage` |

            The `latest.json`, `.sig`, and `.app.tar.gz` files are used by the in-app
            auto-updater — you don't need them for a manual install.

            ### First launch (unsigned builds)

            These installers aren't OS-code-signed yet, so you may get a warning:

            - **macOS** — if it says *"Packetboat is damaged and can't be opened"*,
              that's Gatekeeper on the unsigned download, not real damage. Move it
              to Applications, then run:
              `xattr -dr com.apple.quarantine /Applications/Packetboat.app`
            - **Windows** — on the SmartScreen prompt, click **More info → Run anyway**.
          # Publish immediately (no manual draft step).
          releaseDraft: false
          # Publish as normal (non-pre-release) releases so GitHub's
          # `releases/latest` — the in-app updater endpoint — resolves to them.
          # Marking 0.x as pre-release hides it from `releases/latest`, which 404s
          # the updater. Revisit if/when a pre-release-aware update feed is added.
          prerelease: false
          args: ${{ matrix.args }}
